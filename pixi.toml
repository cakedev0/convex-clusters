[workspace]
name = "convex-clusters"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
numpy = "*"
scikit-learn = "*"
scipy = "*"
threadpoolctl = "*"
pytest = "*"

[tasks]
poc = "python run_poc.py"
bench = "python bench_predict.py"
test = "python -m pytest -q"
